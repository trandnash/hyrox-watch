name: check tickets
on:
  schedule: [{ cron: "17 */8 * * *" }]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - uses: actions/cache@v4   # remembers last state so you only get one email per flip
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: node check.js
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
